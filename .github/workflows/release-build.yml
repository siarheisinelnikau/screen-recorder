name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: 1.96.1
    - name: Safe synthetic checks
      shell: pwsh
      run: ./scripts/verify.ps1 -NativeMedia
    - name: Package standalone executable
      shell: pwsh
      run: ./scripts/package.ps1
    - name: Finite offscreen UI review (no window or devices)
      shell: pwsh
      run: ./scripts/render-review.ps1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ScreenRecorder-windows
        path: dist/*
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ScreenRecorder-ui-review
        include-hidden-files: true
        path: |
          .test-output/render-review-*/*.png
          .test-output/render-review-*/*.json
        if-no-files-found: error
    permissions:
      contents: read
    timeout-minutes: 30
