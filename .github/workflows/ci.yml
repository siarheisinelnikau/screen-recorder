name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Safe synthetic checks
        shell: pwsh
        run: ./scripts/verify.ps1 -NativeMedia
      - name: Package standalone executable
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Finite offscreen UI review (no window or devices)
        shell: pwsh
        run: ./scripts/render-review.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-windows
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-ui-review
          path: |
            .test-output/render-review-*/*.png
            .test-output/render-review-*/*.json
          if-no-files-found: error

  localization-release:
    name: Publish the explicitly requested localization release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ScreenRecorder-windows
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
