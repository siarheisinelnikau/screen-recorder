[package]
name = "screen-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A portable Windows recorder with editable cursor emphasis and zoom"

[[bin]]
name = "ScreenRecorder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.10.9"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = "debuginfo"

